  <meta charset="UTF-8">

  <!-- Open Graph / social link previews (LinkedIn, Slack, etc.) -->

  <meta name="twitter:image" content="assets/images/og-preview.png">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ehsanur Rahman">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png">

  <link rel="manifest" href="manifest.json">


  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #f7f8fa;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #0b0f14;
      }
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    #loading-spinner {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 3px solid rgba(15, 118, 110, 0.15);
      border-top-color: #0f766e;
      animation: loading-spin 0.8s linear infinite;
    }

    @media (prefers-color-scheme: dark) {
      #loading-spinner {
        border-color: rgba(45, 212, 191, 0.15);
        border-top-color: #2dd4bf;
      }
    }

    #loading-name {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #6b7280;
    }

    @media (prefers-color-scheme: dark) {
      #loading-name {
        color: #9ca3af;
      }
    }

    @keyframes loading-spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("loading")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
</head>
<body>
  <div id="loading">
    <div id="loading-spinner" aria-hidden="true"></div>
    <div id="loading-name">Ehsanur Rahman</div>
  </div>

  <script src="flutter_bootstrap.js" async=""></script>


</body></html>
