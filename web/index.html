  <!-- Structured data for search engines. Values are copied by hand from

  <script type="application/ld+json">

  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #f7f8fa;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #0b0f14;
      }
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
      padding: 24px;
    }

    #loading-spinner {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 3px solid rgba(15, 118, 110, 0.15);
      border-top-color: #0f766e;
      animation: loading-spin 0.8s linear infinite;
    }

    @media (prefers-color-scheme: dark) {
      #loading-spinner {
        border-color: rgba(45, 212, 191, 0.15);
        border-top-color: #2dd4bf;
      }
    }

    #loading-name {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #6b7280;
    }

    @media (prefers-color-scheme: dark) {
      #loading-name {
        color: #9ca3af;
      }
    }

    /* Crawler/no-JS fallback copy — visually minimal since it's removed by
       removeSplashFromWeb() the instant Flutter boots, but present in the
       initial HTML for search engines and JS-disabled clients. Flutter Web
       renders to a canvas, so this is the only text a crawler ever sees. */
    #loading-summary {
      max-width: 480px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      line-height: 1.5;
      color: #9ca3af;
    }

    #loading-summary a {
      color: #0f766e;
    }

    @media (prefers-color-scheme: dark) {
      #loading-summary a {
        color: #2dd4bf;
      }
    }

    @keyframes loading-spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("loading")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
</head>
<body>
  <div id="loading">
    <div id="loading-spinner" aria-hidden="true"></div>

      <a href="https://www.linkedin.com/in/sujit70777">LinkedIn</a>
    </p>
  </div>
