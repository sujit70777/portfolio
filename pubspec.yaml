name: portfolio
description: Portfolio developed in flutter.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flex_color_scheme: 8.4.0
  google_fonts: ^8.2.1
  riverpod_annotation: ^4.0.0
  hooks_riverpod: ^3.1.0
  flutter_hooks: ^0.21.3+1
  collection: 1.19.1
  url_launcher: ^6.3.2
  intl: ^0.20.2
  easy_localization: ^3.0.8
  freezed_annotation: ^3.1.0
  shared_preferences: ^2.5.5
  flutter_svg: ^2.3.0
  animated_toggle_switch: ^0.8.7
  path: 1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0
  riverpod_generator: ^4.0.0+1
  build_runner: ^2.15.1
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  # Pinned below latest: 2.4.8 bumped its `meta` requirement to ^1.18.0,
  # which is newer than the `meta` version some Flutter SDK releases pin
  # via flutter_test (e.g. 1.17.0), breaking `pub get` on those SDKs.
  # 2.4.7 only needs meta ^1.16.0, satisfied by 1.17.0.
  flutter_native_splash: 2.4.7
  flutter_launcher_icons: ^0.14.4

flutter:

  uses-material-design: true

  # resume.pdf is deliberately NOT declared here — it lives in
  # web/assets/documents/ instead. A pubspec asset always gets served one
  # path segment deeper than its declared path (flutter build web nests
  # everything under an extra "assets/"), which the resume's URL — opened
  # directly via url_launcher, not resolved through Flutter's AssetBundle —
  # has no way to account for. Files under web/ are copied to the build
  # root verbatim, so this is the only way to get a predictable URL for it.
  assets:
    - assets/fonts/
    - assets/icons/flags/
    - assets/icons/other/
    - assets/icons/software-development/
    - assets/images/
    - assets/projectimage/peace-of-mind-pom/
    - assets/projectimage/forward-sms/
    - assets/projectimage/muslim-times-pro/
    - assets/projectimage/tanto/
    - assets/projectimage/prabartan-educational-platform/
    - assets/projectimage/sk-mobile-school/
    - assets/projectimage/notivio/
    - assets/projectimage/proofsell/
    - assets/projectimage/esim247/
    - assets/projectimage/flutter-scanner-devxhub/
    - assets/projectimage/flutter-prayer-time-calculator/
    - assets/projectimage/flutter-scroll-date-picker/
    - assets/projectimage/flutter-fabric/
    - assets/projectimage/flutter-a11y-lens/
    - assets/projectimage/flutter-liquid-glass-widgets/
    - assets/projectimage/local-voice/
    - assets/projectimage/flutter-crdt-sync-kit/
    - assets/projectimage/ar-measure-in-progress/
    - assets/projectimage/fitness-tracker-senseit/
    - assets/projectimage/jatri-bangladesh-transit-app-in-progress/
    - assets/projectimage/omr-scanner/
    - assets/projectimage/farenow/
    - assets/projectimage/flutter-zoom-image/
    - assets/translations/

  fonts:
    - family: FontAwesome
      fonts:
        - asset: assets/fonts/FontAwesome.ttf
    # Local copies of the three Google Fonts used by the TextTheme
    # (lib/src/constants/themes.dart). Filenames must end with exactly
    # "<GoogleFontsFamily>-<Weight>" (e.g. "Archivo-ExtraBold") — that's the
    # convention the google_fonts package's local-asset detection matches
    # against (see google_fonts_family_with_variant.dart), so it loads these
    # instead of fetching from fonts.gstatic.com at runtime.
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-ExtraBold.ttf
          weight: 800
    - family: PublicSans
      fonts:
        - asset: assets/fonts/PublicSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PublicSans-SemiBold.ttf
          weight: 600
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500


flutter_native_splash:
  color: "#f7f8fa"
  image: "native_splash_source/spinner-light.apng"
  color_dark: "#0b0f14"
  image_dark: "native_splash_source/spinner-dark.apng"
  # The web loading screen is a lightweight CSS spinner hand-written in
  # web/index.html instead — generating these splash images at web/splash/
  # produced multi-megabyte PNGs (up to 6.5MB) that were downloaded before
  # Flutter even started loading.
  web: false
  
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/images/logo.png"
  windows:
    generate: true
    image_path: "assets/images/logo.png"
    icon_size: 256 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/images/logo.png"