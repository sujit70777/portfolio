name: portfolio
description: Portfolio developed in flutter.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flex_color_scheme: 8.4.0
  riverpod_annotation: ^4.0.0
  hooks_riverpod: ^3.1.0
  flutter_hooks: ^0.21.3+1
  collection: 1.19.1
  url_launcher: ^6.3.2
  intl: ^0.20.2
  easy_localization: ^3.0.8
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  shared_preferences: ^2.5.5
  flutter_svg: ^2.3.0
  animated_toggle_switch: ^0.8.7
  path: 1.9.1
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0
  riverpod_generator: ^4.0.0+1
  build_runner: ^2.15.1
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  # Pinned below latest: 2.4.8 bumped its `meta` requirement to ^1.18.0,
  # which is newer than the `meta` version some Flutter SDK releases pin
  # via flutter_test (e.g. 1.17.0), breaking `pub get` on those SDKs.
  # 2.4.7 only needs meta ^1.16.0, satisfied by 1.17.0.
  flutter_native_splash: 2.4.7
  flutter_launcher_icons: ^0.14.4

flutter:

  uses-material-design: true

  # resume.pdf is deliberately NOT declared here — it lives in
  # web/assets/documents/ instead. A pubspec asset always gets served one
  # path segment deeper than its declared path (flutter build web nests
  # everything under an extra "assets/"), which the resume's URL — opened
  # directly via url_launcher, not resolved through Flutter's AssetBundle —
  # has no way to account for. Files under web/ are copied to the build
  # root verbatim, so this is the only way to get a predictable URL for it.
  # NOTE: assets/fonts/ is deliberately NOT listed here. Every font in that
  # directory is already bundled by the `fonts:` section below, and listing
  # the directory as a plain asset too would copy each .ttf verbatim instead
  # of letting Flutter's font pipeline manage them.
  assets:
    - assets/icons/flags/
    - assets/icons/other/
    - assets/icons/software-development/
    - assets/images/
    - assets/projectimage/hourwise/
    - assets/projectimage/subscription-app-stripe-apple-entitlements/
    - assets/projectimage/forward-sms/
    - assets/projectimage/prayer-times-app-high-latitude-engine/
    - assets/projectimage/fintech-reimbursement-native-scanner/
    - assets/projectimage/offline-first-learning-apps/
    - assets/projectimage/secure-video-course-app/
    - assets/projectimage/notes-task-planner-app/
    - assets/projectimage/e-commerce-marketplace-app/
    - assets/projectimage/esim-data-plan-marketplace/
    - assets/projectimage/flutter-scanner-devxhub/
    - assets/projectimage/flutter-prayer-time-calculator/
    - assets/projectimage/flutter-scroll-date-picker/
    - assets/projectimage/flutter-fabric/
    - assets/projectimage/flutter-a11y-lens/
    - assets/projectimage/flutter-liquid-glass-widgets/
    - assets/projectimage/local-voice/
    - assets/projectimage/flutter-crdt-sync-kit/
    - assets/projectimage/ar-measure/
    - assets/projectimage/fitness-tracker-senseit/
    - assets/projectimage/jatri-bangladesh-transit-app/
    - assets/projectimage/omr-scanner/
    - assets/projectimage/multi-service-super-app/
    - assets/projectimage/flutter-zoom-image/
    - assets/translations/

  fonts:
    # Manrope (SIL OFL 1.1, see assets/fonts/Manrope-OFL.txt) is the one
    # family for all text: headings, body and the small data labels. These
    # are subsets of the v2 desktop release, cut to Basic Latin, Latin-1,
    # common punctuation and every character the copy, the Dart sources and
    # the web/ pages actually use (245 glyphs, ~32KB each, ~15KB Brotli'd),
    # with kerning, ligatures and tabular figures kept. The full files were
    # 71KB each, mostly Cyrillic and accented Latin the site never shows.
    # Anything outside the subset falls through to the "Roboto" fallback
    # below. web/index.html and the static pages under web/ load these same
    # files through @font-face, so keep paths in sync if they're renamed.
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.otf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.otf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.otf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.otf
          weight: 800
    # Not a real Roboto. Flutter Web's engine scans the bundled font families
    # for one literally named "Roboto" and, finding none, downloads Roboto
    # from fonts.gstatic.com during startup — 63KB over a fresh cross-origin
    # connection (DNS + TCP + TLS to a third party), on the critical path,
    # for a face this design never shows. Declaring the name satisfies that
    # check and keeps startup on this origin.
    #
    # "Roboto" is also the head of the engine's global fallback list, so any
    # glyph the styled family lacks is looked up here before the engine goes
    # to fonts.gstatic.com for a Noto font. GlyphFallback-Regular.ttf is a
    # ~6KB subset of Noto Sans / Noto Sans Math / Noto Sans Symbols 2 (all
    # SIL OFL 1.1) holding the symbols Manrope lacks that the site uses
    # (↗ ≈ ✓ ✗; missing glyphs used to pull 68KB of Noto Sans Symbols
    # cross-origin during startup), plus a few common arrows and marks. If new
    # copy adds a symbol none of the bundled fonts have, the engine still
    # downloads a Noto font for it — regenerate this subset with it included.
    - family: Roboto
      fonts:
        - asset: assets/fonts/GlyphFallback-Regular.ttf


flutter_native_splash:
  color: "#f7f8fa"
  image: "native_splash_source/spinner-light.apng"
  color_dark: "#0b0f14"
  image_dark: "native_splash_source/spinner-dark.apng"
  # The web loading screen is a lightweight CSS spinner hand-written in
  # web/index.html instead — generating these splash images at web/splash/
  # produced multi-megabyte PNGs (up to 6.5MB) that were downloaded before
  # Flutter even started loading.
  web: false
  
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/images/logo.png"
  windows:
    generate: true
    image_path: "assets/images/logo.png"
    icon_size: 256 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/images/logo.png"