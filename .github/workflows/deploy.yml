name: Deploy to Namecheap

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization
        # lib/src/localization/generated/*.g.dart is a build artifact of
        # assets/translations/*.json, committed to git but not regenerated
        # by `flutter build`. Without this step, CI deploys whatever stale
        # snapshot happens to be checked in rather than the actual content
        # in the translations JSON, silently ignoring content edits that
        # forgot to run `make localization` before committing.
        run: |
          dart run easy_localization:generate -S assets/translations -f json -O lib/src/localization/generated -o locale_json.g.dart
          dart run easy_localization:generate -S assets/translations -f keys -O lib/src/localization/generated -o locale_keys.g.dart

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Build web app
        # --wasm emits a dart2wasm build alongside the dart2js one and lets
        # flutter_bootstrap.js pick per browser, so nothing regresses for
        # clients without WasmGC — they keep getting the JS build. On the
        # ones that have it the renderer is skwasm rather than CanvasKit,
        # which measured ~240KB smaller and ~150ms faster to first frame on a
        # 9Mbps connection. web/index.html's HAS_WASM_BUILD must stay true
        # while this flag is here; the step below enforces that.
        run: flutter build web --wasm --release

      - name: Verify build output before deploying
        run: |
          test -f build/web/index.html
          test -f build/web/main.dart.js
          test -f build/web/main.dart.wasm

      - name: Verify preload hints match the build
        # web/index.html preloads the app and renderer during HTML parse,
        # which means it has to name main.dart.js or main.dart.wasm before
        # flutter_bootstrap.js is around to say which one this build has. It
        # states that in a HAS_WASM_BUILD constant. If the build command
        # gains or loses --wasm and that constant isn't updated in the same
        # commit, every visitor silently downloads ~2MB of the wrong engine
        # alongside the right one, which is worse than not preloading at all.
        # Cheaper to fail here than to ship it.
        run: |
          if [ -f build/web/main.dart.wasm ]; then want=true; else want=false; fi
          if ! grep -q "var HAS_WASM_BUILD = $want;" build/web/index.html; then
            echo "::error::web/index.html sets HAS_WASM_BUILD to the opposite of what this build produced (expected $want). Update it to match the flutter build web flags."
            exit 1
          fi

      - name: Cache-bust resume PDF URLs
        # resume.pdf keeps a stable filename, so a plain redeploy gives
        # returning visitors no signal that the file changed and they can
        # keep seeing a stale cached copy indefinitely. Stamping the content
        # hash onto the URL used to fetch it (in the built translations
        # asset, not the source file) makes every content change a distinct
        # URL, which busts any cache layer — browser, ISP, or the host's own
        # server-side cache — without needing a purge.
        run: |
          TRANSLATIONS=build/web/assets/assets/translations/en.json
          test -f "$TRANSLATIONS"
          for pdf in build/web/assets/documents/*.pdf; do
            hash=$(sha256sum "$pdf" | cut -c1-12)
            url="assets/documents/$(basename "$pdf")"
            jq --arg url "$url" --arg hash "$hash" \
              '(.resumes[]? | select(.url == $url) | .url) |= (. + "?v=" + $hash)' \
              "$TRANSLATIONS" > "$TRANSLATIONS.tmp"
            mv "$TRANSLATIONS.tmp" "$TRANSLATIONS"
          done

      - name: Drop debug symbol maps
        # Each engine variant ships a multi-megabyte .symbols file next to it
        # (canvaskit.js.symbols, skwasm.js.symbols, ...) — a name map for
        # symbolising release stack traces locally. Nothing requests them at
        # runtime, so all they do is take ~7MB of space on the host and get
        # rsynced on every deploy.
        run: find build/web -name '*.symbols' -delete

      - name: Pre-compress static assets
        run: |
          sudo apt-get install -y brotli
          find build/web -type f \
            \( -name '*.js' -o -name '*.mjs' -o -name '*.wasm' -o -name '*.json' \
               -o -name '*.css' -o -name '*.svg' \) \
            -exec brotli -q 11 -k {} \; -exec gzip -9 -k {} \;

      - name: Deploy to Namecheap via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: >-
            -avzr --delete
            --exclude=cse/
            --exclude=ehsanur_apis/
            --exclude=ehsanur_apis.zip
            --exclude=ml/
            --exclude=python/
          path: build/web/
          remote_path: ~/public_html/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_port: ${{ secrets.SSH_PORT }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
