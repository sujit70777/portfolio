name: Deploy to Namecheap

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Build web app
        run: flutter build web --release

      - name: Verify build output before deploying
        run: |
          test -f build/web/index.html
          test -f build/web/main.dart.js

      - name: Pre-compress static assets
        run: |
          sudo apt-get install -y brotli
          find build/web -type f \
            \( -name '*.js' -o -name '*.mjs' -o -name '*.wasm' -o -name '*.json' \
               -o -name '*.css' -o -name '*.svg' \) \
            -exec brotli -q 11 -k {} \; -exec gzip -9 -k {} \;

      - name: Deploy to Namecheap via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: >-
            -avzr --delete
            --exclude=cse/
            --exclude=ehsanur_apis/
            --exclude=ehsanur_apis.zip
            --exclude=ml/
            --exclude=python/
          path: build/web/
          remote_path: ~/public_html/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_port: ${{ secrets.SSH_PORT }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
